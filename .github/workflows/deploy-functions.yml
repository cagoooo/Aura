name: Deploy Cloud Functions

# 只能手動觸發：gh-deployer 服務帳號沒有有效金鑰（2026-09-29 查證），自動部署會 403 失敗。
# 部署函式請用 CLI：firebase deploy --only functions --project aura-2sg5o --account ipad@mail2.smes.tyc.edu.tw
on:
  workflow_dispatch:

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project aura-2sg5o --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AURA }}
